name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Restore
        run: dotnet restore PyramidTreasureConsoleRPG.sln
      - name: Check formatting
        run: dotnet format PyramidTreasureConsoleRPG.sln --verify-no-changes --no-restore
      - name: Build
        run: dotnet build PyramidTreasureConsoleRPG.sln --no-restore --configuration Release -warnaserror
      - name: Test
        run: dotnet test PyramidTreasureConsoleRPG.sln --no-build --configuration Release --logger "trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
